config:
  # Cargo config file fragments
  rustConfigFileFragments:
    - ${BASEDIR}/templates/config.toml.jinja

  # Cargo config file items contributions
  rustConfigFileItems: {}

  # Cargo manifest file fragments
  rustManifestFileFragments:
    - ${BASEDIR}/templates/manifest.toml.jinja

  # Cargo manifest file items contributions
  rustManifestFileItems: {}

  # Rust edition to be maintained in generated manifest file
  rustEdition: 2024

  # Rust package name
  rustPackage: ${projectName}

  # Rust fetch stamp file
  rustFetchStampFile: ${outputDir}/.rustfetch

  # Extra args for cargo fetch command
  rustFetchExtraArgs: []

  # Package dependencies (operational ones)
  rustDependencies: {}

  # Package development dependencies (tools and tests)
  rustDevDependencies: {}

  # Package build dependencies (build scripts)
  rustBuildDependencies: {}

  # Rust ignored lockfile, depending if the project is locked or not
  rustIgnoredLockfile:
    __resolver__: nmk_rust.resolvers.RustIgnoredLockfileResolver

  # Rust files to be ignored
  gitIgnoredFiles:
    - ${rustIgnoredLockfile}

  # Rust version increment from last found tagged version
  rustVersionIncrement: 0.1.0

  # Rust package version
  rustVersion:
    __resolver__: nmk_rust.resolvers.RustVersionResolver
    params:
      increment: ${rustVersionIncrement}
      base_version: ${gitVersion}

tasks:
  rust.config.dir:
    description: Create cargo config folder
    emoji: ":crab:.:file_folder:"
    silent: true
    builder: nmk_base.common.MkdirBuilder
    output: ${rustConfigFolder}

  rust.config:
    description: Generate cargo config file
    emoji: ":crab:.:toolbox:"
    input:
      - ${rustConfigFileFragments}
    output:
      - ${rustConfigFile}
    appendToDeps: setup
    deps:
      - rust.config.dir
    if: ${rustSrcFiles} # Only if rust source files are found
    builder: nmk_base.common.TomlFileBuilder
    params:
      fragment_files: ${rustConfigFileFragments}
      items: ${rustConfigFileItems}
      plugin_name: nmk-rust

  rust.manifest:
    description: Generate cargo manifest file
    emoji: ":crab:.:clipboard:"
    input:
      - ${rustManifestFileFragments}
    output:
      - ${rustManifestFile}
    appendToDeps: setup
    if: ${rustSrcFiles} # Only if rust source files are found
    builder: nmk_base.common.TomlFileBuilder
    params:
      fragment_files: ${rustManifestFileFragments}
      items: ${rustManifestFileItems}
      plugin_name: nmk-rust

  rust.fetch:
    description: Fetch cargo dependencies
    emoji: ":crab:.:inbox_tray:"
    input:
      - ${rustManifestFile}
      - ${rustConfigFile}
    output:
      - ${rustFetchStampFile}
    appendToDeps: setup
    deps:
      - rust.manifest
      - rust.config
      - out
    if: ${rustSrcFiles} # Only if rust source files are found
    builder: nmk_base.common.ProcessBuilder
    params:
      cmd:
        - cargo
        - fetch
        - ${rustFetchExtraArgs}
      verbose: true
